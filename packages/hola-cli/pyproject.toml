[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
# The PyPI name is settled in ticket 12; `hola` itself is taken on PyPI.
name = "hola-cli"
dynamic = ["version"]
description = "Benchmark a local model with the same engine, conditions and Run Record as the holaOS desktop app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Modified Apache 2.0: https://github.com/holaboss-ai/holaOS/blob/main/LICENSE" }
dependencies = []
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Source = "https://github.com/holaboss-ai/holaOS/tree/main/packages/hola-cli"

[project.scripts]
hola = "hola.cli:main"

[tool.hatch.version]
path = "src/hola/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hola"]

[tool.hatch.build.targets.sdist]
include = ["src/hola", "tests", "scripts", "README.md"]
