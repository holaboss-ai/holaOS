name: hola-cli release

on:
  push:
    tags:
      - "hola-cli-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tag matches the package version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('packages/hola-cli/src/hola/__init__.py').read()).group(1))")
          if [ "hola-cli-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match hola-cli ${version} in src/hola/__init__.py"
            exit 1
          fi
      - name: Engine copy matches the desktop's
        working-directory: packages/hola-cli
        run: python scripts/sync-engine.py --check
      - name: Unit tests
        working-directory: packages/hola-cli
        run: python -m unittest discover -s tests
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build packages/hola-cli --outdir dist
      - uses: actions/upload-artifact@v7
        with:
          name: hola-cli-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # PyPI trusted publishing: the pending publisher on PyPI names this workflow file and this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/hola-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hola-cli-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
