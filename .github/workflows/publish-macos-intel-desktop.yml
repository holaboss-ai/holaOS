name: Publish Intel macOS Desktop

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      release_title:
        required: false
        type: string
      prerelease:
        required: true
        type: boolean
      release_channel:
        required: true
        type: string
      artifact_only:
        required: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to release
        required: true
        default: main
        type: string
      release_tag:
        description: Existing or new GitHub release tag in holaOS-releases
        required: true
        type: string
      release_title:
        description: Optional GitHub release title (defaults to Holaboss <version> Intel macOS desktop)
        required: false
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease when first created
        required: true
        default: false
        type: boolean
      release_channel:
        description: Desktop release channel metadata baked into the packaged config
        required: true
        default: latest
        type: choice
        options:
          - latest
          - beta
      artifact_only:
        description: Build the Intel macOS artifact without attaching it to holaOS-releases
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_GH_REPO: holaboss-ai/holaOS-releases
  DESKTOP_ASSET_PREFIX: holaboss-desktop-macos-intel
  DESKTOP_RELEASE_ASSET_NAME: Holaboss-macos-x64.dmg

jobs:
  publish-intel-macos-desktop:
    runs-on: macos-15-intel
    env:
      MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Validate release metadata
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ inputs.release_tag }}"
          if ! printf '%s' "${release_tag}" | grep -Eq '^[Hh]olaboss-[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release_tag must match [Hh]olaboss-YYYY.MDD.R; got ${release_tag}" >&2
            exit 1
          fi

          release_version="${release_tag#[Hh]olaboss-}"
          release_title="${{ inputs.release_title }}"
          if [ -z "${release_title}" ]; then
            release_title="Holaboss ${release_version} Intel macOS desktop"
          fi

          release_channel="${{ inputs.release_channel }}"
          if [ "${release_channel}" != "latest" ] && [ "${release_channel}" != "beta" ]; then
            echo "release_channel must be one of: latest, beta; got ${release_channel}" >&2
            exit 1
          fi
          if [ "${release_channel}" = "beta" ] && [ "${{ inputs.prerelease }}" != "true" ]; then
            echo "beta channel releases must be marked as prerelease" >&2
            exit 1
          fi
          if [ "${release_channel}" = "latest" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            echo "latest channel releases must not be marked as prerelease" >&2
            exit 1
          fi

          {
            echo "release_sha=$(git rev-parse HEAD)"
            echo "release_tag=${release_tag}"
            echo "release_title=${release_title}"
            echo "release_channel=${release_channel}"
            echo "prerelease=${{ inputs.prerelease }}"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Require macOS x64 runner
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -s)" != "Darwin" ]; then
            echo "publish-macos-intel-desktop must run on macOS" >&2
            exit 1
          fi
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "publish-macos-intel-desktop requires an x64 runner; got $(uname -m)" >&2
            exit 1
          fi

      - name: Install workspace dependencies (covers desktop)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: bun install --frozen-lockfile

      - name: Build macOS runtime bundle
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          HOLABOSS_RUNTIME_VERSION: ${{ steps.release_meta.outputs.release_tag }}
        run: bash runtime/deploy/package_macos_runtime.sh out/runtime-macos

      - name: Build app SDK
        run: bun --filter=@holaboss/app-sdk run build

      - name: Require mac signing and notarization credentials
        run: |
          missing=()
          [ -n "${MAC_CERTIFICATE}" ] || missing+=("MAC_CERTIFICATE")
          [ -n "${MAC_CERTIFICATE_PASSWORD}" ] || missing+=("MAC_CERTIFICATE_PASSWORD")
          [ -n "${APPLE_ID}" ] || missing+=("APPLE_ID")
          [ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ] || missing+=("APPLE_APP_SPECIFIC_PASSWORD")
          [ -n "${APPLE_TEAM_ID}" ] || missing+=("APPLE_TEAM_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "missing required mac release secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare mac signing certificate
        id: prepare_mac_certificate
        shell: bash
        run: |
          set -euo pipefail
          cert_path="${RUNNER_TEMP}/mac-signing-certificate.p12"
          CERT_PATH="${cert_path}" python3 - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          raw = os.environ["MAC_CERTIFICATE"].strip()
          compact = "".join(raw.split())
          if raw.startswith(("http://", "https://", "file://", "/")):
              sys.stderr.write(
                  "MAC_CERTIFICATE must be the base64-encoded contents of the Developer ID Application .p12, not a path or URL.\n"
              )
              sys.exit(1)

          try:
              data = base64.b64decode(compact, validate=True)
          except Exception as exc:
              sys.stderr.write(f"MAC_CERTIFICATE is not valid base64: {exc}\n")
              sys.stderr.write(
                  "Set MAC_CERTIFICATE to the base64-encoded contents of the Developer ID Application .p12 file.\n"
              )
              sys.exit(1)

          if not data:
              sys.stderr.write("MAC_CERTIFICATE decoded to an empty file.\n")
              sys.exit(1)

          output_path = pathlib.Path(os.environ["CERT_PATH"])
          output_path.write_bytes(data)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"certificate_path={output_path}\n")
          PY
          # GitHub macOS runners ship OpenSSL 3.x, which moves legacy PKCS#12 ciphers
          # (e.g. RC2-40-CBC, the default produced by macOS Keychain .p12 exports) into
          # the legacy provider that is not loaded by default. Pass -legacy when the CLI
          # supports it so this validation can read the certificate; fall back for
          # OpenSSL < 3.0 / LibreSSL, which carry these ciphers in the default provider.
          if openssl pkcs12 -help 2>&1 | grep -q -- '-legacy'; then
            openssl pkcs12 -legacy -in "${cert_path}" -passin "pass:${MAC_CERTIFICATE_PASSWORD}" -noout >/dev/null
          else
            openssl pkcs12 -in "${cert_path}" -passin "pass:${MAC_CERTIFICATE_PASSWORD}" -noout >/dev/null
          fi

      - name: Build desktop code for Intel macOS release
        working-directory: apps/desktop
        shell: bash
        env:
          HOLABOSS_RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          HOLABOSS_RELEASE_CHANNEL: ${{ steps.release_meta.outputs.release_channel }}
          HOLABOSS_RUNTIME_DIR: ${{ github.workspace }}/out/runtime-macos/
          HOLABOSS_AUTH_BASE_URL: ${{ vars.HOLABOSS_AUTH_BASE_URL }}
          HOLABOSS_AUTH_SIGN_IN_URL: ${{ vars.HOLABOSS_AUTH_SIGN_IN_URL }}
          HOLABOSS_BACKEND_BASE_URL: ${{ vars.HOLABOSS_BACKEND_BASE_URL }}
          HOLABOSS_WEB_APP_BASE_URL: ${{ vars.HOLABOSS_WEB_APP_BASE_URL }}
          HOLABOSS_DESKTOP_CONTROL_PLANE_BASE_URL: ${{ vars.HOLABOSS_DESKTOP_CONTROL_PLANE_BASE_URL }}
          HOLABOSS_PROJECTS_URL: ${{ vars.HOLABOSS_PROJECTS_URL }}
          HOLABOSS_MARKETPLACE_URL: ${{ vars.HOLABOSS_MARKETPLACE_URL }}
          HOLABOSS_PROACTIVE_URL: ${{ vars.HOLABOSS_PROACTIVE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GITHUB_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ steps.prepare_mac_certificate.outputs.certificate_path }}
          CSC_KEY_PASSWORD: ${{ env.MAC_CERTIFICATE_PASSWORD }}
        run: |
          soft_limit="$(ulimit -Sn)"
          hard_limit="$(ulimit -Hn)"
          echo "open file limits before build: soft=${soft_limit} hard=${hard_limit}"
          target_limit=65536
          if [ "${hard_limit}" != "unlimited" ] && [ "${hard_limit}" -lt "${target_limit}" ]; then
            target_limit="${hard_limit}"
          fi
          if [ "${soft_limit}" -lt "${target_limit}" ]; then
            ulimit -n "${target_limit}" || true
          fi
          echo "open file limits for build: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
          npm run prepare:runtime
          npm run prepare:packaged-config
          npm run build

      - name: Build signed Intel macOS app bundle
        id: build_signed_app
        working-directory: apps/desktop
        shell: bash
        env:
          HOLABOSS_RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          HOLABOSS_RELEASE_CHANNEL: ${{ steps.release_meta.outputs.release_channel }}
          CSC_LINK: ${{ steps.prepare_mac_certificate.outputs.certificate_path }}
          CSC_KEY_PASSWORD: ${{ env.MAC_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          rm -rf out/release
          node scripts/run-electron-builder.mjs \
            --projectDir "$PWD" \
            --publish never \
            --mac dir \
            --x64 \
            --config.mac.notarize=false
          app_path="$(find out/release -maxdepth 2 -name '*.app' -print -quit)"
          if [ -z "${app_path}" ]; then
            echo "no .app bundle found under apps/desktop/out/release" >&2
            exit 1
          fi
          app_path="$(cd "$(dirname "${app_path}")" && pwd)/$(basename "${app_path}")"
          if [ ! -f "${app_path}/Contents/Resources/app-update.yml" ]; then
            echo "app-update.yml is missing from signed Intel macOS app bundle" >&2
            exit 1
          fi
          packaged_app="${RUNNER_TEMP}/Holaboss.app"
          rm -rf "${packaged_app}"
          ditto "${app_path}" "${packaged_app}"
          echo "app_path=${packaged_app}" >> "${GITHUB_OUTPUT}"

      - name: Validate signed Intel macOS app bundle
        shell: bash
        run: |
          app_path="${{ steps.build_signed_app.outputs.app_path }}"
          if [ -z "${app_path}" ] || [ ! -d "${app_path}" ]; then
            echo "signed Intel macOS app bundle was not produced or no longer exists: ${app_path}" >&2
            exit 1
          fi
          # `codesign --verify` intermittently throws "internal error in Code
          # Signing subsystem" on CI macOS runners even when the bundle is valid
          # on disk and satisfies its Designated Requirement — retry before
          # failing the build.
          verify_attempt=1
          until codesign --verify --deep --strict --verbose=2 "${app_path}"; do
            if [ "${verify_attempt}" -ge 3 ]; then
              echo "codesign --verify failed after ${verify_attempt} attempts" >&2
              exit 1
            fi
            echo "codesign --verify hit a transient failure; retrying in 15s (attempt ${verify_attempt}/3)" >&2
            sleep 15
            verify_attempt=$((verify_attempt + 1))
          done

      - name: Notarize signed Intel macOS app bundle
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          app_path="${{ steps.build_signed_app.outputs.app_path }}"
          if [ -z "${app_path}" ] || [ ! -d "${app_path}" ]; then
            echo "signed Intel macOS app bundle was not produced correctly: ${app_path}" >&2
            exit 1
          fi
          max_attempts=3
          attempt=1
          while true; do
            log_path="${RUNNER_TEMP}/notarize-intel-app-attempt-${attempt}.log"
            echo "notarization attempt ${attempt}/${max_attempts}"

            if node scripts/notarize-app.mjs "${app_path}" 2>&1 | tee "${log_path}"; then
              break
            fi

            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "notarization failed after ${attempt} attempts" >&2
              exit 1
            fi

            if ! grep -Fq "Failed to notarize via notarytool" "${log_path}"; then
              echo "notarization failed with a non-notarytool error; not retrying" >&2
              exit 1
            fi

            if ! grep -Eq \
              'The Internet connection appears to be offline|NSURLErrorDomain Code=-1009|network connection was lost|timed out|temporarily unavailable|could not connect to the server|A server with the specified hostname could not be found' \
              "${log_path}"; then
              echo "notarization failed with a non-retryable error; not retrying" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "transient notarization failure detected; retrying after ${sleep_seconds}s" >&2
            sleep "${sleep_seconds}"
            attempt=$((attempt + 1))
          done

      - name: Validate notarized Intel macOS app bundle
        shell: bash
        run: |
          app_path="${{ steps.build_signed_app.outputs.app_path }}"
          if [ -z "${app_path}" ] || [ ! -d "${app_path}" ]; then
            echo "notarized Intel macOS app bundle was not produced: ${app_path}" >&2
            exit 1
          fi
          # `codesign --verify` intermittently throws "internal error in Code
          # Signing subsystem" on CI macOS runners even when the bundle is valid
          # on disk and satisfies its Designated Requirement — retry before
          # failing the build.
          verify_attempt=1
          until codesign --verify --deep --strict --verbose=2 "${app_path}"; do
            if [ "${verify_attempt}" -ge 3 ]; then
              echo "codesign --verify failed after ${verify_attempt} attempts" >&2
              exit 1
            fi
            echo "codesign --verify hit a transient failure; retrying in 15s (attempt ${verify_attempt}/3)" >&2
            sleep 15
            verify_attempt=$((verify_attempt + 1))
          done
          # `spctl` (Gatekeeper assessment) does a notarization ticket/daemon
          # check right after stapling and intermittently reports "a sealed
          # resource is missing or invalid" even when `codesign --verify --deep
          # --strict` above already confirmed the seal is valid on disk — retry
          # before failing the build, same as codesign.
          spctl_attempt=1
          until spctl -a -vv -t exec "${app_path}"; do
            if [ "${spctl_attempt}" -ge 3 ]; then
              echo "spctl assessment failed after ${spctl_attempt} attempts" >&2
              exit 1
            fi
            echo "spctl assessment hit a transient failure; retrying in 15s (attempt ${spctl_attempt}/3)" >&2
            sleep 15
            spctl_attempt=$((spctl_attempt + 1))
          done
          xcrun stapler validate "${app_path}"

      - name: Build Intel macOS desktop release artifacts from notarized app bundle
        working-directory: apps/desktop
        shell: bash
        env:
          HOLABOSS_RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          HOLABOSS_RELEASE_CHANNEL: ${{ steps.release_meta.outputs.release_channel }}
        run: |
          set -euo pipefail
          app_path="${{ steps.build_signed_app.outputs.app_path }}"
          if [ -z "${app_path}" ] || [ ! -d "${app_path}" ]; then
            echo "notarized Intel macOS app bundle was not produced correctly: ${app_path}" >&2
            exit 1
          fi
          # Split dmg + zip into two electron-builder calls inside the helper,
          # then merge the zip-pass `*-mac.yml` entries back into the dmg-pass
          # manifests so files: keeps both. Combined `--mac dmg zip` shipped
          # holaOS-2026.608.2 with the DMG's Electron Framework main binary
          # stripped (Gatekeeper rejected with "Apple could not verify"); the
          # split avoids that, and the merge keeps downstream
          # merge-mac-update-manifests.rb happy. Validation below hard-fails
          # the workflow if the DMG still ends up broken.
          bash scripts/build-mac-release-artifacts.sh "${app_path}" --x64

      - name: Validate Intel macOS auto-update artifacts
        shell: bash
        run: |
          set -euo pipefail
          primary_channel="${{ steps.release_meta.outputs.release_channel }}"
          if [ "${primary_channel}" = "beta" ]; then
            primary_manifest_name="beta-mac.yml"
          else
            primary_manifest_name="latest-mac.yml"
          fi
          dmg_path="$(find apps/desktop/out/release -maxdepth 1 -name '*.dmg' -print -quit)"
          zip_path="$(find apps/desktop/out/release -maxdepth 1 -name '*.zip' ! -name '*.blockmap' -print -quit)"
          manifest_path="apps/desktop/out/release/${primary_manifest_name}"
          if [ -z "${dmg_path}" ]; then
            echo "no Intel macOS DMG found in apps/desktop/out/release" >&2
            exit 1
          fi
          if [ -z "${zip_path}" ]; then
            echo "no Intel macOS zip found in apps/desktop/out/release" >&2
            exit 1
          fi
          if [ ! -f "${manifest_path}" ]; then
            echo "${primary_manifest_name} was not generated for Intel macOS" >&2
            exit 1
          fi
          if [ "${primary_channel}" = "latest" ]; then
            beta_manifest_path="apps/desktop/out/release/beta-mac.yml"
            cp "${manifest_path}" "${beta_manifest_path}"
            if [ ! -f "${beta_manifest_path}" ]; then
              echo "beta-mac.yml was not generated for stable-channel Intel macOS compatibility" >&2
              exit 1
            fi
          fi
          # Assert every *-mac.yml manifest in out/release has both a .zip and
          # a .dmg entry under files: — the split zip/dmg build above merges
          # them back together and downstream merge-mac-update-manifests.rb
          # in publish-release requires both. Catch any regression here, in
          # the per-platform job, rather than at publish time.
          while IFS= read -r mac_manifest_path; do
            ruby -ryaml -e '
              path = ARGV[0]
              data = YAML.load_file(path)
              files = data.is_a?(Hash) ? Array(data["files"]) : []
              has_zip = files.any? { |f| f.is_a?(Hash) && f["url"].to_s.end_with?(".zip") }
              has_dmg = files.any? { |f| f.is_a?(Hash) && f["url"].to_s.end_with?(".dmg") }
              abort("#{path} files: is missing a .zip entry") unless has_zip
              abort("#{path} files: is missing a .dmg entry") unless has_dmg
            ' "${mac_manifest_path}"
          done < <(find apps/desktop/out/release -maxdepth 1 -name '*-mac.yml' -print)
          if ! zipinfo -1 "${zip_path}" | grep -Eq '^Holaboss\.app/'; then
            echo "Intel macOS zip does not contain Holaboss.app as the root app bundle" >&2
            exit 1
          fi
          if ! zipinfo -1 "${zip_path}" | grep -Fxq 'Holaboss.app/Contents/Resources/app-update.yml'; then
            echo "app-update.yml is missing from final Intel macOS zip" >&2
            exit 1
          fi
          extract_dir="${RUNNER_TEMP}/intel-mac-zip-signature-verify"
          rm -rf "${extract_dir}"
          mkdir -p "${extract_dir}"
          ditto -x -k "${zip_path}" "${extract_dir}"
          extracted_app="${extract_dir}/Holaboss.app"
          if [ ! -d "${extracted_app}" ]; then
            echo "Holaboss.app was not extracted from the final Intel macOS zip" >&2
            exit 1
          fi
          verify_attempt=1
          until codesign --verify --deep --strict --verbose=2 "${extracted_app}"; do
            if [ "${verify_attempt}" -ge 3 ]; then
              echo "codesign --verify failed after ${verify_attempt} attempts" >&2
              exit 1
            fi
            echo "codesign --verify hit a transient failure; retrying in 15s (attempt ${verify_attempt}/3)" >&2
            sleep 15
            verify_attempt=$((verify_attempt + 1))
          done
          # See "Validate notarized" step: spctl can transiently fail even when
          # codesign --verify passed on disk — retry before failing.
          spctl_attempt=1
          until spctl -a -vv -t exec "${extracted_app}"; do
            if [ "${spctl_attempt}" -ge 3 ]; then
              echo "spctl assessment failed after ${spctl_attempt} attempts" >&2
              exit 1
            fi
            echo "spctl assessment hit a transient failure; retrying in 15s (attempt ${spctl_attempt}/3)" >&2
            sleep 15
            spctl_attempt=$((spctl_attempt + 1))
          done
          xcrun stapler validate "${extracted_app}"

      - name: Validate Intel macOS DMG bundle signing
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find apps/desktop/out/release -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "${dmg_path}" ]; then
            echo "no Intel macOS DMG found in apps/desktop/out/release" >&2
            exit 1
          fi
          mount_dir="${RUNNER_TEMP}/intel-mac-dmg-signature-verify"
          rm -rf "${mount_dir}"
          mkdir -p "${mount_dir}"
          # Attach without auto-opening Finder; capture the mount point so we can detach reliably.
          mount_output="$(hdiutil attach -nobrowse -readonly -mountroot "${mount_dir}" "${dmg_path}")"
          mount_point="$(printf '%s\n' "${mount_output}" | awk -F'\t' '/\t\/.*\// {print $NF}' | tail -n1)"
          if [ -z "${mount_point}" ] || [ ! -d "${mount_point}" ]; then
            echo "could not determine mount point for ${dmg_path}" >&2
            printf '%s\n' "${mount_output}" >&2
            exit 1
          fi
          trap 'hdiutil detach "${mount_point}" -quiet || hdiutil detach "${mount_point}" -force || true' EXIT
          mounted_app="$(find "${mount_point}" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "${mounted_app}" ] || [ ! -d "${mounted_app}" ]; then
            echo "no .app bundle found inside mounted DMG at ${mount_point}" >&2
            exit 1
          fi
          # Hard fail if the Electron Framework main binary is missing — this is the specific
          # regression we shipped on holaOS-2026.608.2 where the DMG output stripped it.
          fw_bin="${mounted_app}/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"
          if [ ! -f "${fw_bin}" ]; then
            echo "Electron Framework main binary is missing from DMG: ${fw_bin}" >&2
            echo "DMG contents under Versions/A:" >&2
            ls -la "${mounted_app}/Contents/Frameworks/Electron Framework.framework/Versions/A/" >&2 || true
            exit 1
          fi
          verify_attempt=1
          until codesign --verify --deep --strict --verbose=2 "${mounted_app}"; do
            if [ "${verify_attempt}" -ge 3 ]; then
              echo "codesign --verify failed after ${verify_attempt} attempts" >&2
              exit 1
            fi
            echo "codesign --verify hit a transient failure; retrying in 15s (attempt ${verify_attempt}/3)" >&2
            sleep 15
            verify_attempt=$((verify_attempt + 1))
          done
          # See "Validate notarized" step: spctl can transiently fail even when
          # codesign --verify passed on disk — retry before failing.
          spctl_attempt=1
          until spctl -a -vv -t exec "${mounted_app}"; do
            if [ "${spctl_attempt}" -ge 3 ]; then
              echo "spctl assessment failed after ${spctl_attempt} attempts" >&2
              exit 1
            fi
            echo "spctl assessment hit a transient failure; retrying in 15s (attempt ${spctl_attempt}/3)" >&2
            sleep 15
            spctl_attempt=$((spctl_attempt + 1))
          done
          xcrun stapler validate "${mounted_app}"

      - name: Normalize Intel macOS release asset name
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$(find apps/desktop/out/release -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "${dmg_path}" ]; then
            echo "no Intel macOS DMG found in apps/desktop/out/release" >&2
            exit 1
          fi
          target_path="apps/desktop/out/release/${DESKTOP_RELEASE_ASSET_NAME}"
          if [ "${dmg_path}" != "${target_path}" ]; then
            cp "${dmg_path}" "${target_path}"
          fi

      - name: Upload Intel macOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DESKTOP_ASSET_PREFIX }}-${{ inputs.release_tag }}
          path: |
            apps/desktop/out/release/${{ env.DESKTOP_RELEASE_ASSET_NAME }}
            apps/desktop/out/release/*.zip
            apps/desktop/out/release/*.zip.blockmap
            apps/desktop/out/release/*-mac.yml
          if-no-files-found: error
          # Consumed by ci.yml's publish-release within the same run; no need to retain.
          retention-days: 1

      - name: Prepare release notes
        if: ${{ !inputs.artifact_only }}
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          notes_path="${RUNNER_TEMP}/intel-macos-release-notes.md"
          cat > "${notes_path}" <<'EOF'
          Intel macOS x64 desktop build for `${{ steps.release_meta.outputs.release_tag }}`.

          - channel: `${{ steps.release_meta.outputs.release_channel }}`
          - commit: `${{ steps.release_meta.outputs.release_sha }}`
          - asset: `${DESKTOP_RELEASE_ASSET_NAME}`
          - updater: shared `latest-mac.yml` / `beta-mac.yml` manifests include both Apple Silicon and Intel macOS ZIP assets
          EOF
          echo "notes_path=${notes_path}" >> "${GITHUB_OUTPUT}"

      - name: Ensure GitHub release exists
        if: ${{ !inputs.artifact_only }}
        env:
          GH_TOKEN: ${{ secrets.HOLABOSS_RELEASES_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "Intel macOS release publishing to ${RELEASE_GH_REPO} requires HOLABOSS_RELEASES_REPO_TOKEN" >&2
            exit 1
          fi
          if ! gh release view --repo "${RELEASE_GH_REPO}" "${{ steps.release_meta.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "Intel macOS updater publishing requires an existing ${RELEASE_GH_REPO} release for ${{ steps.release_meta.outputs.release_tag }}" >&2
            exit 1
          fi

      - name: Download shared macOS updater manifests
        if: ${{ !inputs.artifact_only }}
        id: download_shared_manifests
        env:
          GH_TOKEN: ${{ secrets.HOLABOSS_RELEASES_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_dir="${RUNNER_TEMP}/existing-mac-manifests"
          rm -rf "${manifest_dir}"
          mkdir -p "${manifest_dir}"
          gh release download "${{ steps.release_meta.outputs.release_tag }}" \
            --repo "${RELEASE_GH_REPO}" \
            --pattern '*-mac.yml' \
            --dir "${manifest_dir}"
          if ! find "${manifest_dir}" -maxdepth 1 -name '*-mac.yml' | grep -q .; then
            echo "shared macOS updater manifests are missing from ${RELEASE_GH_REPO} release ${{ steps.release_meta.outputs.release_tag }}" >&2
            exit 1
          fi
          echo "manifest_dir=${manifest_dir}" >> "${GITHUB_OUTPUT}"

      - name: Merge Intel macOS updater manifests with existing release manifests
        if: ${{ !inputs.artifact_only }}
        shell: bash
        run: |
          set -euo pipefail
          existing_manifest_dir="${{ steps.download_shared_manifests.outputs.manifest_dir }}"
          if [ -z "${existing_manifest_dir}" ] || [ ! -d "${existing_manifest_dir}" ]; then
            echo "existing shared macOS updater manifest directory is unavailable: ${existing_manifest_dir}" >&2
            exit 1
          fi
          local_manifest_count=0
          while IFS= read -r local_manifest_path; do
            local_manifest_count=$((local_manifest_count + 1))
            manifest_name="$(basename "${local_manifest_path}")"
            shared_manifest_path="${existing_manifest_dir}/${manifest_name}"
            if [ ! -f "${shared_manifest_path}" ]; then
              echo "shared macOS updater manifest is missing from ${RELEASE_GH_REPO}: ${manifest_name}" >&2
              exit 1
            fi
            ruby apps/desktop/scripts/merge-mac-update-manifests.rb \
              "${local_manifest_path}" \
              "${shared_manifest_path}" \
              "${local_manifest_path}"
          done < <(find apps/desktop/out/release -maxdepth 1 -name '*-mac.yml' -print | sort)
          if [ "${local_manifest_count}" -eq 0 ]; then
            echo "no local Intel macOS updater manifests were produced" >&2
            exit 1
          fi

      - name: Upload Intel macOS release assets
        if: ${{ !inputs.artifact_only }}
        env:
          GH_TOKEN: ${{ secrets.HOLABOSS_RELEASES_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "Intel macOS release publishing to ${RELEASE_GH_REPO} requires HOLABOSS_RELEASES_REPO_TOKEN" >&2
            exit 1
          fi
          gh release upload "${{ steps.release_meta.outputs.release_tag }}" \
            --repo "${RELEASE_GH_REPO}" \
            "apps/desktop/out/release/${DESKTOP_RELEASE_ASSET_NAME}" \
            apps/desktop/out/release/*.zip \
            apps/desktop/out/release/*.zip.blockmap \
            apps/desktop/out/release/*-mac.yml \
            --clobber
